# Once a month, rebuild Sabah's place list (public/places/sabah.json) from the
# newest Overture Maps release and OpenStreetMap, and commit it. Cloudflare
# Pages then redeploys the app with the fresh list, like any other push to main.
# Run it by hand from GitHub → Actions → "Refresh Sabah places" → Run workflow.
name: Refresh Sabah places

on:
  schedule:
    # 28th of each month, 04:00 Malaysia time. Overture publishes around the third week.
    - cron: '0 20 27 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install duckdb==2.0.0
      - run: python scripts/build_places.py
      - name: Commit the new list
        run: |
          if git diff --quiet -- public/places; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/places
          git commit -m "Refresh Sabah places ($(date -u +%Y-%m-%d))"
          git push
